name: Correction / my side of the story
description: An edit to existing book text, or your side of a story already in the book.
title: "Correction: "
labels: ["correction", "needs-clark-review", "openbook"]
body:
  - type: markdown
    attributes:
      value: |
        Use this if something in the book should be corrected, or if you were there and have your side of a story. If something identifies you or includes private information, use the **Takedown request** template instead. Clark reviews every correction. An agent only starts work after he adds the `approved` label, and the change lands on the `next-revision` branch until he cuts the next edition.
  - type: input
    id: who
    attributes:
      label: How you know this story
      description: Your relationship to the story, for example "I was there". No real names of other people.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which chapter or passage
      description: Chapter title, a quote, or a link to the page.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What it says now
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Your correction or your side of the story
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: The name or handle to list under Contributors. You won't be named as a character; the book is fiction and everyone in it is renamed.
  - type: checkboxes
    id: terms
    attributes:
      label: Contributor terms
      description: See CONTRIBUTING.md (Contributor terms).
      options:
        - label: I have the right to share this, and it contains no confidential, NDA, customer, security, or deal information.
          required: true
        - label: I haven't used real names of private people, companies, or venues, and I'm not knowingly stating false facts about anyone.
          required: true
        - label: I agree this may be renamed, fictionalized, combined, exaggerated, rewritten, or not used, and I license it under the project's terms in CONTRIBUTING.md.
          required: true
