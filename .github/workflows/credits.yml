name: Update contributor credits

# Regenerates /credits and credits.json from GitHub issues and pull requests.
# Uses GITHUB_TOKEN only. Does not need ANTHROPIC_API_KEY.
# Opens or updates a pull request into main; it never pushes to main itself.
# Only Clark merges.

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  schedule:
    # Monday 11:00 America/Detroit in EST (UTC-5). In EDT this is 12:00.
    - cron: "0 16 * * 1"
  workflow_dispatch:

jobs:
  credits:
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate credits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/build_credits.py

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- credits.json credits/; then
            echo "No credit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/update-credits
          git add credits.json credits/index.md credits/index.html credits/AGENTS.md
          git commit -m "chore: refresh contributor credits"
          git push --force-with-lease origin chore/update-credits
          existing="$(gh pr list --base main --head chore/update-credits --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing pull request #$existing"
          else
            label_args=()
            if gh label list --json name --jq '.[].name' | grep -Fxq 'needs-clark-review'; then
              label_args=(--label needs-clark-review)
            fi
            gh pr create --base main --head chore/update-credits \
              --title "Refresh contributor credits" \
              "${label_args[@]}" \
              --body "Automatically generated by the \`credits\` workflow from GitHub issues and merged pull requests.

          Credits use GitHub handles only. Bots are excluded. People who asked not to be credited are omitted.

          Please review and merge. This workflow never pushes to \`main\` on its own."
          fi
