services:
  - type: web
    name: openbook-reader-staging
    runtime: docker
    dockerfilePath: ./integrations/reader-sync/Dockerfile
    dockerContext: .
    branch: next-revision
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: READER_ENV
        value: staging
      - key: READER_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
